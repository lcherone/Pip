<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Pip — small puppy, big desktop adventures</title>
  <desc id="desc">A cream and golden banner with the Pip wordmark, a paw emblem, and an illustrated golden puppy perched on a desktop window. His speech bubble says: Hi. I saved you a wag.</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#f8ddb0"/>
      <stop offset="0.55" stop-color="#e2a44b"/>
      <stop offset="1" stop-color="#b8742e"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#b8742e" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1280" height="520" rx="28" fill="#fff6ea"/>
