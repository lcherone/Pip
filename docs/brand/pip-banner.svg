  <rect x="744" y="24" width="512" height="472" fill="url(#dots)"/>
  <g font-family="ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" fill="#3c2b29">
    <text x="76" y="91" font-size="16" font-weight="700" letter-spacing="3">YOUR DESKTOP. HIS LITTLE WORLD.</text>
    <text x="68" y="254" font-size="172" font-weight="800" letter-spacing="-8">Pip</text>
