    </g>
    <text x="76" y="316" font-size="32" font-weight="700">Small puppy.</text>
    <text x="76" y="358" font-size="32" font-weight="700">Big desktop adventures.</text>
    <text x="76" y="418" font-size="19">A little golden company for your Mac.</text>
    <text x="76" y="451" font-size="15" fill="#704831">WINDOW WALKIES / TINY NAPS / OPTIONAL CODEX</text>
